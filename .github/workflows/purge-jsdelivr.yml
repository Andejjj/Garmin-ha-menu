name: Purge Garmin Menu Cache

on:
  push:
    branches:
      - main
    paths:
      - menu.json

jobs:
  purge:
    runs-on: ubuntu-latest

    steps:
      - name: Purge menu.json from jsDelivr
        run: |
          curl --fail --silent --show-error \
            "https://purge.jsdelivr.net/gh/Andejjj/Garmin-ha-menu@main/menu.json"
